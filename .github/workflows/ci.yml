name: CI

on:
  push:
    branches: [main]
  pull_request:

# The checks only read the code. Nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  check:
    name: Check and build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          # The Raspberry Pi is arm64, so the tests also run on real arm64 hardware.
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      # Actions are pinned to exact commits so a changed tag cannot alter what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Make sure the shell script checker is available
        run: command -v shellcheck || (sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck)

      - name: Format, static analysis, shell script checks and tests
        run: make check

      - name: Build the interface and the programs for amd64 and arm64
        run: make build

      - name: Run the built program
        run: ./bin/sgc-linux-${{ matrix.arch }} version

      - name: Build the release files
        run: make dist

      # A release must be the same files whoever builds it, so that anyone
      # can rebuild one and compare (scripts/verify-release.sh). This catches
      # one way of losing that: the result depending on the build machine's
      # language setting, which once changed the order of the files inside
      # the archives.
      - name: The release files do not depend on the machine's language setting
        run: |
          locale -a | grep -qi '^en_US\.utf-\?8$' || sudo locale-gen en_US.UTF-8
          LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8 SGC_SKIP_WEB_BUILD=1 bash scripts/dist.sh /tmp/dist-other-language
          diff dist/SHA256SUMS /tmp/dist-other-language/SHA256SUMS
