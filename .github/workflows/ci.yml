name: CI

on:
  push:
    branches: [main]
  pull_request:

# The checks only read the code. Nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  check:
    name: Check and build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          # The Raspberry Pi is arm64, so the tests also run on real arm64 hardware.
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      # Actions are pinned to exact commits so a changed tag cannot alter what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Format, static analysis and tests
        run: make check

      - name: Build for amd64 and arm64
        run: make build

      - name: Run the built program
        run: ./bin/sgc-linux-${{ matrix.arch }} version
