// Written by SGC (Server Gateway Control). Do not edit: SGC writes this file
// again from its own settings. Change them on SGC's System page.
// sgc-mode: by-hand

// Debian's lists of what exists are fetched every day in both modes.
APT::Periodic::Enable "1";
APT::Periodic::Update-Package-Lists "1";
// "1": updates install by themselves once a day. "0": only when the
// owner starts them in SGC's page.
APT::Periodic::Unattended-Upgrade "0";

// Restarting the device after an update is SGC's business, not the
// update tool's.
Unattended-Upgrade::Automatic-Reboot "false";

// In addition to what Debian's own settings allow. A Raspberry Pi's kernel
// and firmware come from this archive. Elsewhere the line matches nothing.
Unattended-Upgrade::Origins-Pattern {
	"origin=Raspberry Pi Foundation,codename=${distro_codename},label=Raspberry Pi Foundation";
};
